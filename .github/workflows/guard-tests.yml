name: Guard tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run guard unit tests
        run: python3 -m unittest discover -s .devcontainer/home/.cursor/hooks -p 'test_*.py' -v
